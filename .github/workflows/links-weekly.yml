name: Weekly link check

on:
  schedule:
    # Monday 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: Links (production)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .lycheecache
          key: lychee-${{ github.run_id }}
          restore-keys: lychee-
      # A failing run is the alert; no issues are opened automatically.
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml https://alfonsoramos.dev
          fail: true
